name: Synchronize images

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '30 5,17 * * *'
  workflow_dispatch: {}
  push:
   branches:
    - main

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install skopeo
        run: sudo apt-get install -y skopeo

      - name: Install manifest-tool
        run: |
          curl -sL https://github.com/estesp/manifest-tool/releases/latest/download/binaries-manifest-tool-2.2.1.tar.gz | tar xz manifest-tool-linux-amd64
          sudo mv manifest-tool-linux-amd64 /usr/local/bin/manifest-tool

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./sync.sh
